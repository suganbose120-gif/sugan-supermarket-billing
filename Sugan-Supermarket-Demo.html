  function dashboardHtml(){const day=state.sales.filter(s=>s.day===todayKey());const salesTotal=day.reduce((n,s)=>n+s.total,0),low=state.products.filter(p=>p.stock<=p.threshold);return `<div class="page-head"><div><div class="eyebrow">STORE OVERVIEW</div><h1>Good day, cashier</h1><p class="sub">A quick view of your Sugan Supermarket demo.</p></div><div class="actions"><button class="btn btn-primary" data-go="billing">＋ Start a new bill</button></div></div><div class="demo-note"><b>Demo data only.</b> This HTML keeps its sample products and demo sales in browser storage. It does not connect to the production database or TallyPrime.</div><div class="stats"><div class="stat"><span class="stat-icon">₹</span><div class="stat-label">Today's sales</div><div class="stat-value">${money(salesTotal)}</div><div class="stat-note">Completed demo bills only</div></div><div class="stat"><span class="stat-icon">▤</span><div class="stat-label">Bills today</div><div class="stat-value">${day.length}</div><div class="stat-note">Demo transactions</div></div><div class="stat"><span class="stat-icon">◇</span><div class="stat-label">Products in store</div><div class="stat-value">${state.products.length}</div><div class="stat-note">Sample catalog in this browser</div></div><div class="stat"><span class="stat-icon">!</span><div class="stat-label">Low stock alerts</div><div class="stat-value">${low.length}</div><div class="stat-note">At or below sample threshold</div></div></div><div class="grid2"><section class="panel"><div class="panel-head"><div><h2>Quick access</h2><p>Jump to a demo workflow</p></div></div><div class="quick"><button data-go="billing"><span>▣</span>New bill</button><button data-go="products"><span>◇</span>Products</button><button data-go="inventory"><span>▦</span>Inventory</button><button data-go="sales"><span>▤</span>Sales history</button><button data-go="reports"><span>▥</span>Reports</button><button data-go="settings"><span>⚙</span>Settings</button></div></section><section class="panel"><div class="panel-head"><div><h2>Stock watch</h2><p>Products at or below demo threshold</p></div><button class="btn btn-quiet" data-go="inventory">View inventory →</button></div>${low.length?`<div class="table-wrap"><table><thead><tr><th>PRODUCT</th><th>ON HAND</th><th>STATUS</th></tr></thead><tbody>${low.slice(0,6).map(p=>`<tr><td><b>${esc(p.name)}</b><br><small class="muted">${esc(p.category)}</small></td><td>${p.stock} ${esc(p.unit)}</td><td><span class="tag low">Low stock</span></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">All demo products are above their threshold.</div>'}</section></div><section class="panel" style="margin-top:16px"><div class="panel-head"><div><h2>Recent transactions</h2><p>Completed demo bills</p></div><button class="btn btn-quiet" data-go="sales">View all →</button></div>${recentTable(day.slice().reverse().slice(0,5))}</section>`;}
  function billingHtml(){return `<div class="page-head"><div><div class="eyebrow">POINT OF SALE · DEMO</div><h1>New bill</h1><p class="sub">Scan a barcode, choose a product or search by name. Press F2 to start a new bill.</p></div><span class="tag">${esc(billRef)}</span></div><div class="pos-grid"><section class="panel"><div class="panel-head"><div><h2>Add products</h2><p>USB scanners that type a barcode and press Enter work in this field.</p></div></div><div class="scan-row"><input id="barcodeInput" autocomplete="off" placeholder="Scan barcode or type SKU, then press Enter" aria-label="Scan barcode"><button class="btn btn-primary" id="scanBtn">Add code</button></div><div class="searchbar"><input id="productSearch" placeholder="Search products by name, barcode or SKU"><button class="btn" id="clearSearch">Clear</button></div><div id="productResults" class="product-results"></div></section><section class="panel cart-panel"><div class="panel-head"><div><h2>Current bill</h2><p><span id="cartCount">${totalQty()}</span> items · ${esc(billRef)}</p></div><button class="btn btn-quiet btn-danger" id="clearCart">Clear</button></div><div class="cart-scroll">${cart.length?`<table class="cart-table"><thead><tr><th>ITEM</th><th>QTY</th><th>DISC ₹</th><th class="right">TOTAL</th><th></th></tr></thead><tbody>${cart.map((r,i)=>`<tr><td><b>${esc(r.product.name)}</b><br><small class="muted">${money(r.product.price)} / ${esc(r.product.unit)}</small></td><td><input class="qty" type="number" min="0.001" step="0.001" value="${r.qty}" data-qty="${i}" aria-label="Quantity"></td><td><input class="discount" type="number" min="0" step="0.01" value="${(r.discount/100).toFixed(2)}" data-discount="${i}" aria-label="Discount in rupees"></td><td class="right strong">${money(Math.max(0,Math.round(r.product.price*r.qty)-r.discount))}</td><td><button class="remove" data-remove="${i}" aria-label="Remove item">×</button></td></tr>`).join('')}</tbody></table>`:`<div class="empty">Your bill is empty.<br>Scan a product barcode to begin.</div>`}</div><div class="totals"><div class="total-line"><span>Subtotal</span><b>${money(cart.reduce((n,r)=>n+Math.round(r.product.price*r.qty),0))}</b></div><div class="total-line"><span>Discount</span><b>−${money(discountTotal())}</b></div><div class="total-line grand"><span>PAYABLE</span><span>${money(total())}</span></div></div><div class="payment-tabs"><button class="pay-tab ${payment==='cash'?'active':''}" data-pay="cash">Cash</button><button class="pay-tab ${payment==='upi'?'active':''}" data-pay="upi">UPI</button></div><div id="payBox" class="pay-box">${payment==='cash'?`<label for="received">AMOUNT RECEIVED</label><input id="received" type="number" min="0" step="0.01" placeholder="${(total()/100).toFixed(2)}"><div class="change-row"><span>Change due</span><b id="change">${money(0)}</b></div>`:`<div class="qr-layout"><img id="upiQr" alt="Bill-specific demo UPI QR"><div><strong>${money(total())}</strong><p>Scan to pay the exact bill amount.<br>Payee: Sugan Bose<br>UPI ID: suganbose120@okicici</p></div></div><div class="warning">Demo only: a QR code or cashier confirmation does not verify payment. UPI apps can differ in how they treat editable amounts.</div>`}</div><button class="btn btn-primary complete" id="completeSale" ${cart.length?'':'disabled'}>Complete demo sale</button></section></div>`;}
  function productSearchResults(q=''){const query=q.trim().toLowerCase();const found=state.products.filter(p=>!query||[p.name,p.barcode,p.sku,p.category].some(x=>String(x).toLowerCase().includes(query))).slice(0,8);return found.map(p=>`<button class="product-choice" data-add="${esc(p.id)}"><span><strong>${esc(p.name)}</strong><small>${esc(p.barcode)} · ${esc(p.category)} · stock ${p.stock}</small></span><b>${money(p.price)}</b></button>`).join('')||'<div class="empty">No matching demo products.</div>';}
  function productsHtml(){return `<div class="page-head"><div><div class="eyebrow">CATALOG</div><h1>Products</h1><p class="sub">Edit the demo catalog, add barcodes or export CSV.</p></div><div class="actions"><button class="btn" id="exportProducts">Export CSV</button><button class="btn" id="importProducts">Import CSV</button><input type="file" id="csvFile" accept=".csv,text/csv" hidden><button class="btn btn-primary" id="addProduct">＋ Add product</button></div></div><section class="panel"><div class="toolbar"><input id="productFilter" placeholder="Search name, SKU or barcode"><span class="muted">${state.products.length} products · browser demo data</span></div><div class="table-wrap"><table><thead><tr><th>PRODUCT</th><th>BARCODE / SKU</th><th>CATEGORY</th><th>PRICE</th><th>STOCK</th><th></th></tr></thead><tbody id="productRows">${productRows(state.products)}</tbody></table></div></section>`;}

  function inventoryHtml(){return `<div class="page-head"><div><div class="eyebrow">STOCK CONTROL</div><h1>Inventory</h1><p class="sub">Restock or adjust quantities in this demo browser.</p></div><button class="btn btn-primary" id="stockAction">＋ Stock movement</button></div><section class="panel"><div class="toolbar"><input id="inventoryFilter" placeholder="Search products"><span class="muted">${state.products.filter(p=>p.stock<=p.threshold).length} low-stock items</span></div><div class="table-wrap"><table><thead><tr><th>PRODUCT</th><th>BARCODE</th><th>ON HAND</th><th>THRESHOLD</th><th>STATUS</th><th></th></tr></thead><tbody id="inventoryRows">${inventoryRows(state.products)}</tbody></table></div></section>`;}

  function recentTable(list){return list.length?`<div class="table-wrap"><table><thead><tr><th>BILL NUMBER</th><th>DATE & TIME</th><th>ITEMS</th><th>PAYMENT</th><th class="right">TOTAL</th><th></th></tr></thead><tbody>${list.map(s=>`<tr><td class="mono">${esc(s.number)}</td><td>${dateText(s.date)}</td><td>${s.items.length} items</td><td><span class="tag">${esc(s.payment.toUpperCase())}</span></td><td class="right strong">${money(s.total)}</td><td><button class="btn" data-print="${esc(s.id)}">Print</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No completed demo bills yet. Complete a sale to see it here.</div>';}

  function reportsHtml(){const byDay=state.sales.filter(s=>s.day===todayKey()),gross=byDay.reduce((n,s)=>n+s.items.reduce((a,i)=>a+(i.price-i.cost)*i.qty-i.discount,0),0);const tops={};state.sales.forEach(s=>s.items.forEach(i=>{tops[i.name]=(tops[i.name]||0)+i.qty;}));const best=Object.entries(tops).sort((a,b)=>b[1]-a[1]).slice(0,5);return `<div class="page-head"><div><div class="eyebrow">DEMO REPORTS</div><h1>Reports</h1><p class="sub">Totals are derived from completed demo bills only.</p></div><button class="btn" id="exportSales">Export sales CSV</button></div><div class="stats"><div class="stat"><div class="stat-label">Today's sales</div><div class="stat-value">${money(byDay.reduce((n,s)=>n+s.total,0))}</div><div class="stat-note">${byDay.length} demo bills</div></div><div class="stat"><div class="stat-label">Cash received</div><div class="stat-value">${money(byDay.filter(s=>s.payment==='cash').reduce((n,s)=>n+s.total,0))}</div><div class="stat-note">Cash method</div></div><div class="stat"><div class="stat-label">UPI sales</div><div class="stat-value">${money(byDay.filter(s=>s.payment==='upi').reduce((n,s)=>n+s.total,0))}</div><div class="stat-note">Demo payment records</div></div><div class="stat"><div class="stat-label">Estimated gross profit</div><div class="stat-value">${money(gross)}</div><div class="stat-note">Based on sample cost prices</div></div></div><section class="panel"><div class="panel-head"><div><h2>Best-selling products</h2><p>Quantity across completed demo sales</p></div></div>${best.length?`<div class="table-wrap"><table><thead><tr><th>PRODUCT</th><th>QUANTITY SOLD</th></tr></thead><tbody>${best.map(([name,qty])=>`<tr><td><b>${esc(name)}</b></td><td>${qty}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Complete a demo sale to populate reports.</div>'}</section>`;}
  function tallyHtml(){return `<div class="page-head"><div><div class="eyebrow">INTEGRATION PREVIEW</div><h1>TallyPrime integration</h1><p class="sub">This standalone HTML demo is not connected to your local TallyPrime instance.</p></div><span class="tag low">Not connected in demo</span></div><div class="demo-note"><b>Production integration remains in the main application.</b> Run the full app with <code>npm run dev</code> to test its backend XML connection, mappings, dry runs and retry-safe queue. This HTML file never sends XML or sales data to Tally.</div><section class="panel"><h2>What this demo represents</h2><p class="sub" style="line-height:1.8">Cash and UPI checkout, bill totals, stock reduction, product search and receipts can be demonstrated here. The production server is required for persistent SQLite records and TallyPrime synchronization.</p></section>`;}
  function settingsHtml(){return `<div class="page-head"><div><div class="eyebrow">DEMO PREFERENCES</div><h1>Settings</h1><p class="sub">These details affect only demo receipts in this browser.</p></div></div><section class="panel settings-list"><div class="field-stack"><label>Store name<input id="setName" value="${esc(state.settings.name)}"></label><label>Address<input id="setAddress" value="${esc(state.settings.address)}" placeholder="Optional store address"></label><label>Phone number<input id="setPhone" value="${esc(state.settings.phone)}" placeholder="Optional phone"></label><label>Receipt footer<input id="setFooter" value="${esc(state.settings.footer)}"></label><label>Receipt paper<select id="setWidth"><option value="80" ${state.settings.receiptWidth==='80'?'selected':''}>80 mm</option><option value="58" ${state.settings.receiptWidth==='58'?'selected':''}>58 mm</option></select></label></div><div class="actions" style="margin-top:16px"><button class="btn btn-primary" id="saveSettings">Save demo settings</button><button class="btn btn-danger" id="resetDemo">Reset demo data</button></div></section>`;}
  function bindPage(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>b.dataset.go==='billing'?startBill():go(b.dataset.go));if(page==='billing')bindBilling();if(page==='products')bindProducts();if(page==='inventory')bindInventory();if(page==='sales'){bindSales();}if(page==='reports')$('exportSales')?.addEventListener('click',exportSales);if(page==='settings')bindSettings();}
  function bindBilling(){const scanner=$('barcodeInput');scanner?.focus();scanner?.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();scan(scanner.value);scanner.value='';}});$('scanBtn').onclick=()=>{scan(scanner.value);scanner.value='';scanner.focus();};$('productSearch').addEventListener('input',e=>{$('productResults').innerHTML=productSearchResults(e.target.value);bindAddButtons();});$('clearSearch').onclick=()=>{$('productSearch').value='';$('productResults').innerHTML=productSearchResults();bindAddButtons();};$('productResults').innerHTML=productSearchResults();bindAddButtons();$('clearCart').onclick=()=>{if(cart.length&&confirm('Clear all unpaid items from this demo bill?')){cart=[];billRef=createRef();render();}};document.querySelectorAll('[data-qty]').forEach(el=>el.onchange=()=>{const i=Number(el.dataset.qty),v=Number(el.value);if(!Number.isFinite(v)||v<=0){notify('Quantity must be greater than zero');render();return;}cart[i].qty=Math.round(v*1000)/1000;render();});document.querySelectorAll('[data-discount]').forEach(el=>el.onchange=()=>{const i=Number(el.dataset.discount),v=Math.round(Number(el.value)*100);if(!Number.isFinite(v)||v<0){notify('Discount must be zero or more');render();return;}cart[i].discount=Math.min(v,Math.round(cart[i].product.price*cart[i].qty));render();});document.querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>{cart.splice(Number(el.dataset.remove),1);render();});document.querySelectorAll('[data-pay]').forEach(el=>el.onclick=()=>{payment=el.dataset.pay;render();});const received=$('received');if(received)received.oninput=()=>{$('change').textContent=money(Math.max(0,Math.round(Number(received.value||0)*100)-total()));};$('completeSale').onclick=completeSale;if(payment==='upi'&&total()){qrData().then(data=>{const image=$('upiQr');if(image)image.src=data;}).catch(()=>notify('Could not create the demo UPI QR.'));}}

  function completeSale(){if(!cart.length){notify('Add at least one item before completing the demo sale.');return;}for(const row of cart){if(row.qty>row.product.stock){notify(`Insufficient demo stock for ${row.product.name}.`);return;}}const amount=total();let received=amount,change=0;if(payment==='cash'){received=Math.round(Number($('received')?.value||0)*100);if(received<amount){notify('Amount received is less than the payable amount.');return;}change=received-amount;}else if(!confirm(`Demo only: record ${money(amount)} as UPI for ${billRef}? This does not verify a payment.`))return;const sale={id:createRef(),number:billRef,date:new Date().toISOString(),day:todayKey(),payment,total:amount,subtotal:cart.reduce((n,r)=>n+Math.round(r.product.price*r.qty),0),discount:discountTotal(),received,change,items:cart.map(r=>({name:r.product.name,barcode:r.product.barcode,qty:r.qty,unit:r.product.unit,price:r.product.price,cost:r.product.cost,discount:r.discount,lineTotal:Math.max(0,Math.round(r.product.price*r.qty)-r.discount),gst:r.product.gst}))};state.sales.push(sale);sale.items.forEach(i=>{const p=state.products.find(p=>p.barcode===i.barcode);if(p)p.stock=Math.max(0,Math.round((p.stock-i.qty)*1000)/1000);});persist();cart=[];payment='cash';billRef=createRef();render();notify(`Demo bill ${sale.number} completed`);if(confirm('Sale recorded in demo storage. Print this demo receipt now?'))printSale(sale);}
  function printSale(s){$('printArea').innerHTML=`<div class="center"><h2>${esc(state.settings.name)}</h2>${state.settings.address?`<div>${esc(state.settings.address)}</div>`:''}${state.settings.phone?`<div>${esc(state.settings.phone)}</div>`:''}</div><hr><div>Bill: ${esc(s.number)}</div><div>Date: ${esc(dateText(s.date))}</div><div>Payment: ${esc(s.payment.toUpperCase())}</div><hr>${s.items.map(i=>`<div class="item"><b>${esc(i.name)}</b><div class="line"><span>${i.qty} ${esc(i.unit)} × ${money(i.price)}</span><span>${money(i.lineTotal)}</span></div>${i.discount?`<div class="line"><span>Discount</span><span>−${money(i.discount)}</span></div>`:''}</div>`).join('')}<hr><div class="line"><span>Subtotal</span><b>${money(s.subtotal)}</b></div><div class="line"><span>Discount</span><b>−${money(s.discount)}</b></div><div class="line"><b>PAYABLE</b><b>${money(s.total)}</b></div>${s.payment==='cash'?`<div class="line"><span>Received</span><span>${money(s.received)}</span></div><div class="line"><span>Change</span><span>${money(s.change)}</span></div>`:''}<div class="thanks">${esc(state.settings.footer)}</div>`;window.print();}
  function bindProducts(){const filter=$('productFilter'),rows=$('productRows');filter.oninput=()=>{const q=filter.value.toLowerCase();rows.innerHTML=productRows(state.products.filter(p=>[p.name,p.sku,p.barcode,p.category].some(x=>String(x).toLowerCase().includes(q))));bindProductRowActions();};$('addProduct').onclick=()=>productModal();$('exportProducts').onclick=exportProducts;$('importProducts').onclick=()=>$('csvFile').click();$('csvFile').onchange=e=>importCsv(e.target.files[0]);bindProductRowActions();}
  function bindProductRowActions(){document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>productModal(state.products.find(p=>p.id===b.dataset.edit)));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(!confirm('Delete this product from the demo catalog?'))return;state.products=state.products.filter(p=>p.id!==b.dataset.delete);persist();render();notify('Demo product deleted');});}
  function productModal(product){const p=product||{id:'',name:'',barcode:unknownBarcode||'',sku:'',category:'',price:0,cost:0,stock:0,threshold:5,unit:'piece',gst:0};$('modalBody').innerHTML=`<h2>${product?'Edit':'Add'} demo product</h2><form id="productForm" class="form-grid"><label>Product name<input name="name" required value="${esc(p.name)}"></label><label>Barcode (optional)<input name="barcode" value="${esc(p.barcode)}"></label><label>SKU<input name="sku" value="${esc(p.sku)}"></label><label>Category<input name="category" value="${esc(p.category)}"></label><label>Selling price ₹<input name="price" type="number" min="0" step="0.01" required value="${(p.price/100).toFixed(2)}"></label><label>Purchase price ₹<input name="cost" type="number" min="0" step="0.01" value="${(p.cost/100).toFixed(2)}"></label><label>Stock quantity<input name="stock" type="number" min="0" step="0.001" value="${p.stock}"></label><label>Low-stock threshold<input name="threshold" type="number" min="0" step="0.001" value="${p.threshold}"></label><label>Unit<select name="unit">${['piece','kg','litre','packet','box'].map(u=>`<option ${p.unit===u?'selected':''}>${u}</option>`).join('')}</select></label><label>GST rate %<input name="gst" type="number" min="0" max="100" step="0.01" value="${p.gst}"></label><div class="wide modal-actions"><button type="button" class="btn" id="cancelModal">Cancel</button><button class="btn btn-primary">Save demo product</button></div></form>`;$('modal').showModal();$('cancelModal').onclick=()=>$('modal').close();$('productForm').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.currentTarget),barcode=String(fd.get('barcode')).trim();if(barcode&&state.products.some(x=>x.barcode===barcode&&x.id!==p.id)){notify('That barcode is already used by another demo product.');return;}const item={id:p.id||createRef(),name:String(fd.get('name')).trim(),barcode,sku:String(fd.get('sku')).trim(),category:String(fd.get('category')).trim(),price:Math.round(Number(fd.get('price'))*100),cost:Math.round(Number(fd.get('cost'))*100),stock:Number(fd.get('stock')),threshold:Number(fd.get('threshold')),unit:String(fd.get('unit')),gst:Number(fd.get('gst'))};if(!Number.isFinite(item.price)||item.price<0||item.stock<0||item.threshold<0||item.gst<0||item.gst>100){notify('Check the price, stock, threshold and GST values.');return;}if(p.id)state.products=state.products.map(x=>x.id===p.id?item:x);else state.products.push(item);persist();unknownBarcode='';$('modal').close();render();notify('Demo product saved');};}
  function bindInventory(){const f=$('inventoryFilter');f.oninput=()=>{$('inventoryRows').innerHTML=inventoryRows(state.products.filter(p=>[p.name,p.barcode,p.category].some(x=>String(x).toLowerCase().includes(f.value.toLowerCase()))));bindStockButtons();};$('stockAction').onclick=()=>stockModal();bindStockButtons();}
  function bindStockButtons(){document.querySelectorAll('[data-stock]').forEach(b=>b.onclick=()=>stockModal(state.products.find(p=>p.id===b.dataset.stock)));}
  function stockModal(product){const p=product||state.products[0];if(!p){notify('Add a demo product first.');return;}$('modalBody').innerHTML=`<h2>Demo stock movement</h2><form id="stockForm" class="field-stack"><label>Product<select name="id">${state.products.map(x=>`<option value="${esc(x.id)}" ${x.id===p.id?'selected':''}>${esc(x.name)} · ${x.stock} ${esc(x.unit)}</option>`).join('')}</select></label><label>Movement<select name="kind"><option value="restock">Restock (add)</option><option value="adjust">Adjustment (subtract)</option></select></label><label>Quantity<input name="qty" type="number" min="0.001" step="0.001" required></label><div class="modal-actions"><button type="button" class="btn" id="cancelModal">Cancel</button><button class="btn btn-primary">Save movement</button></div></form>`;$('modal').showModal();$('cancelModal').onclick=()=>$('modal').close();$('stockForm').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.currentTarget),item=state.products.find(x=>x.id===fd.get('id')),qty=Number(fd.get('qty'));if(!item||!Number.isFinite(qty)||qty<=0)return;if(fd.get('kind')==='adjust'&&qty>item.stock){notify('Adjustment would make demo stock negative.');return;}item.stock=Math.round((item.stock+(fd.get('kind')==='restock'?qty:-qty))*1000)/1000;persist();$('modal').close();render();notify('Demo stock updated');};}
  function bindSales(){const f=$('salesFilter');f.oninput=()=>{$('salesRows').innerHTML=recentTable(state.sales.slice().reverse().filter(s=>s.number.toLowerCase().includes(f.value.toLowerCase())));bindPrintButtons();};$('exportSales').onclick=exportSales;bindPrintButtons();}
  function bindPrintButtons(){document.querySelectorAll('[data-print]').forEach(b=>b.onclick=()=>{const sale=state.sales.find(s=>s.id===b.dataset.print);if(sale)printSale(sale);});}
  function bindSettings(){$('saveSettings').onclick=()=>{state.settings={...state.settings,name:$('setName').value.trim()||'SUGAN SUPERMARKET',address:$('setAddress').value.trim(),phone:$('setPhone').value.trim(),footer:$('setFooter').value.trim()||'Thank you for shopping with us!',receiptWidth:$('setWidth').value};persist();notify('Demo settings saved');};$('resetDemo').onclick=()=>{if(confirm('Reset this browser’s demo catalog, settings and demo sales? This does not affect the production database.')){state=fresh();persist();go('dashboard');notify('Demo data reset');}};}
  function exportProducts(){const header=['barcode','sku','name','category','selling_price_rupees','purchase_price_rupees','stock','unit','gst_rate'];const rows=[header,...state.products.map(p=>[p.barcode,p.sku,p.name,p.category,(p.price/100).toFixed(2),(p.cost/100).toFixed(2),p.stock,p.unit,p.gst])];downloadCsv('sugan-demo-products.csv',rows);}
  function exportSales(){const rows=[['bill_number','date','payment_method','total_rupees','item_name','quantity','line_total_rupees'],...state.sales.flatMap(s=>s.items.map(i=>[s.number,s.date,s.payment,(s.total/100).toFixed(2),i.name,i.qty,(i.lineTotal/100).toFixed(2)]))];downloadCsv('sugan-demo-sales.csv',rows);}
  function downloadCsv(name,rows){const csv=rows.map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
  function parseCsv(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++;}else if(c==='"')quoted=false;else cell+=c;}else if(c==='"')quoted=true;else if(c===','){row.push(cell);cell='';}else if(c==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell='';}else cell+=c;}if(cell||row.length){row.push(cell);rows.push(row);}return rows;}
  function importCsv(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const rows=parseCsv(String(reader.result)),head=rows.shift().map(x=>x.trim().toLowerCase()),at=k=>head.indexOf(k);let added=0;for(const r of rows){const name=r[at('name')];if(!name)continue;const barcode=r[at('barcode')]||'';if(barcode&&state.products.some(p=>p.barcode===barcode))continue;state.products.push({id:createRef(),name,barcode,sku:r[at('sku')]||'',category:r[at('category')]||'',price:Math.round(Number(r[at('selling_price_rupees')]||0)*100),cost:Math.round(Number(r[at('purchase_price_rupees')]||0)*100),stock:Number(r[at('stock')]||0),threshold:5,unit:r[at('unit')]||'piece',gst:Number(r[at('gst_rate')]||0)});added++;}persist();render();notify(`${added} demo product(s) imported`);}catch{notify('Could not read this CSV. Use the demo product CSV template.');}};reader.readAsText(file);}
  function bindGlobalKeys(){window.addEventListener('keydown',e=>{if(e.key==='F2'&&!$('modal').open){e.preventDefault();startBill();}});}
  $('nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(!b)return;if(b.dataset.page==='billing')startBill();else go(b.dataset.page);});$('modal').addEventListener('click',e=>{if(e.target===$('modal'))$('modal').close();});bindGlobalKeys();render();
})();
</script>

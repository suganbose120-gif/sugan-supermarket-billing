services:
  - type: web
    name: sugan-supermarket-billing
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: sugan-billing-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: TALLY_ADMIN_TOKEN
        sync: false
